<section class="page-section" id="contact">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">
          <p>Contact</p>
</h2>
        <h3 class="section-subheading text-muted"></h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="8fe175bd-61ce-46ac-9557-c06e6b56bb64">
            <input type="hidden" name="redirect" id="redirectURL">
            <script>
            document.getElementById('redirectURL').value = window.location.protocol + '//' + window.location.host + '/pages/thankyou_en.html';
            </script>
          <!--name="sentMessage"-->
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <input name="name" class="form-control" id="name" type="text"
                  placeholder="Name*"
                  required="required" data-validation-required-message="Please enter your name.">
                <p class="help-block text-danger"></p>
              </div>
              <div class="form-group">
                <input name="_replyto" class="form-control" id="email" type="email"
                  placeholder="Email*"
                  required="required" data-validation-required-message="Please enter your email address.">
                <p class="help-block text-danger"></p>
              </div>
              <div class="form-group">
                <input name="phone" class="form-control" id="phone" type="tel"
                  placeholder="Phone"
                   data-validation-required-message="Please enter your phone number.">
                <p class="help-block text-danger"></p>
              </div>
              
              <div class="form-group">
                <label class="form-label-mono" for="kurs">Which course?</label>
                <select name="kurs" id="kurs" class="form-control form-select-light">
                  <option value="">Please choose (optional)</option>
                  
                  <optgroup label="Sidemount & SDI / TDI">
                    <option>Try dive sidemount or doubles</option><option>SDI Sidemount Diver</option><option>TDI Intro to Tech</option><option>TDI Sidemount Diver</option><option>SDI DPV Diver</option><option>TDI Advanced Nitrox</option><option>TDI Decompression Procedures</option>
                  </optgroup>
                  
                  <optgroup label="GUE courses">
                    <option>Open Water Diver</option><option>Advanced Open Water Diver</option><option>Performance Diver</option><option>Basic Fundamentals</option><option>Technical Fundamentals</option><option>Navigation Primer</option><option>DPV 1</option><option>Doubles & Drysuit Primer</option><option>Other primers</option>
                  </optgroup>
                  
                  <optgroup label="Personal training">
                    <option>Personal training, half day</option><option>Personal training, full day</option>
                  </optgroup>
                  
                  <option>Not sure yet, please advise</option>
                </select>
              </div>
              <div class="form-group">
                <input name="tauchgaenge" class="form-control" id="dives" type="text"
                  placeholder="Certification and number of dives, e.g. AOWD, 60 dives, or “none yet”">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <textarea name="message" class="form-control" id="message"
                  placeholder="Message*"
                  required="required" data-validation-required-message="Please enter a message."></textarea>
                <p class="help-block text-danger"></p>
              </div>
            </div>
            <input type="hidden" name="_subject" id="email-subject"
              value="Contact Form Submission">
            <div class="clearfix"></div>
            <div class="col-lg-12 text-center">
              <div id="success"></div>
              <button id="sendMessageButton" class="btn btn-primary btn-xl text-uppercase"
                type="submit" data-umami-event="contact-submit">Send Message</button>
              <p class="form-privacy">Your details are only used to handle your enquiry. See the <a href="/pages/legal_en.html">privacy policy</a>.</p>
            </div>
            <input type="text" name="_gotcha" style="display:none">
            <input type="hidden" name="_next" value="#" />
          </div>
        </form>
      </div>
    </div>
  </div>
</section>


<script>
// Pre-fill message from URL parameter (e.g., from course inquiry button)
(function() {
  var urlParams = new URLSearchParams(window.location.search);
  var messageParam = urlParams.get('message');
  var messageField = document.getElementById('message');
  
  if (messageField && messageParam) {
    messageField.value = messageParam; // URLSearchParams dekodiert bereits
  }
})();
</script>
